<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
ESP-01S MQTT 控制面板
</title>

<link
rel="manifest"
href="./manifest.json"
/>

<meta
name="theme-color"
content="#2563eb"
/>

<style>

body{
  margin:0;
  padding:20px;
  background:#f3f4f6;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1100px;
  margin:auto;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h1,h2,h3{
  margin-top:0;
}

.status{
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  color:white;
  font-weight:bold;
  font-size:14px;
}

.online{
  background:#16a34a;
}

.offline{
  background:#dc2626;
}

.relay-on{
  background:#16a34a;
}

.relay-off{
  background:#ef4444;
}

.info{
  margin-top:14px;
  line-height:1.8;
}

.section{
  margin-top:20px;
  border-top:1px solid #e5e7eb;
  padding-top:16px;
}

.small{
  font-size:13px;
  color:#6b7280;
}

.btn-row{
  display:flex;
  gap:12px;
  margin-top:20px;
}

button{
  border:none;
  border-radius:12px;
  padding:14px;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.btn-on{
  flex:1;
  background:#16a34a;
}

.btn-off{
  flex:1;
  background:#ef4444;
}

.btn-save{
  width:100%;
  background:#2563eb;
}

input[type="time"],
select{
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-left:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
ESP-01S MQTT 控制面板
</h1>

<div id="mqttStatus">

<span class="status offline">
MQTT 未連線
</span>

</div>

</div>

<div id="devices"></div>

</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>

// =====================================================
// MQTT
// =====================================================

const MQTT_BROKER =
"wss://broker.emqx.io:8084/mqtt";

// =====================================================
// 防止編輯時 UI 被 render 覆蓋
// =====================================================

let editingSchedule = false;

// =====================================================
// Devices
// =====================================================

const DEVICES = [

{
  id:"switch01",
  name:"開關 1",
  base:"gavinwea414-a11y/esp-switch01/relay1"
},

{
  id:"switch02",
  name:"開關 2",
  base:"gavinwea414-a11y/esp-switch02/relay1"
}

];

// =====================================================
// State
// =====================================================

const state = {};

function initializeDeviceState(device){

  return {

    relay:"OFF",
    status:"offline",

    autoEnabled:true,
    onTime:"19:00",
    offTime:"23:30",
    timezone:"8",

    heartbeat:"尚未收到",
    lastEvent:"尚未收到",
    lastEventTime:"尚未收到",

    uptime:"尚未收到",
    freeHeap:"尚未收到",
    rssi:"尚未收到",

    wifiFailCount:"0",
    mqttFailCount:"0",
    wifiForceResetCount:"0",

    lastUpdate:"尚未收到"
  };
}

// =====================================================
// Topics
// =====================================================

function getTopics(base){

  const t=(b,s)=>`${b}/${s}`;

  return {

    set:t(base,"set"),
    state:t(base,"state"),

    autoEnabledSet:t(base,"auto/enabled/set"),
    autoEnabledState:t(base,"auto/enabled/state"),

    scheduleOnSet:t(base,"schedule/on/set"),
    scheduleOnState:t(base,"schedule/on/state"),

    scheduleOffSet:t(base,"schedule/off/set"),
    scheduleOffState:t(base,"schedule/off/state"),

    timezoneSet:t(base,"timezone/set"),
    timezoneState:t(base,"timezone/state"),

    status:t(base,"status"),
    heartbeat:t(base,"heartbeat"),

    event:t(base,"event"),
    eventTime:t(base,"event_time"),

    healthUptime:t(base,"health/uptime"),
    healthHeap:t(base,"health/free_heap"),
    healthRssi:t(base,"health/rssi"),

    diagWifiFailCount:t(base,"diag/wifi_fail_count"),
    diagMqttFailCount:t(base,"diag/mqtt_fail_count"),
    diagWifiForceResetCount:t(base,"diag/wifi_force_reset_count")
  };
}

// =====================================================
// Init State
// =====================================================

DEVICES.forEach(device=>{

  state[device.id] =
  initializeDeviceState(device);

});

// =====================================================
// Render
// =====================================================

function render(){

  const mount =
  document.getElementById("devices");

  mount.innerHTML =
  DEVICES.map(renderCard).join("");
}

// =====================================================
// Render Card
// =====================================================

function renderCard(device){

  const s =
  state[device.id];

  return `

<div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
"
>

<div>

<h2>
${device.name}
</h2>

<div class="small">
${device.base}
</div>

</div>

<div>

<span
class="status ${s.status==="online"
?"online"
:"offline"}"
>

${s.status==="online"
?"設備在線"
:"設備離線"}

</span>

</div>

</div>

<div class="info">

<div style="margin-bottom:12px;">

<b>目前狀態：</b>

<span
class="
status
${s.relay==="ON"
?"relay-on"
:"relay-off"}
"
>

${s.relay==="ON"
?"繼電器開啟"
:"繼電器關閉"}

</span>

</div>

<div>

<b>排程摘要：</b>

${s.autoEnabled
?"自動"
:"停用"}

｜開 ${s.onTime}

｜關 ${s.offTime}

｜UTC+${s.timezone}

</div>

<div>
<b>最後 heartbeat：</b>
${s.heartbeat}
</div>

<div>
<b>最後事件：</b>
${s.lastEvent}
</div>

<div>
<b>最後事件時間：</b>
${s.lastEventTime}
</div>

<div class="section">

<h3>
健康狀態
</h3>

<div>
<b>運行時間：</b>
${s.uptime}
</div>

<div>
<b>剩餘記憶體：</b>
${s.freeHeap}
</div>

<div>
<b>Wi-Fi 訊號：</b>
${s.rssi}
</div>

</div>

<div class="section">

<h3>
診斷資訊
</h3>

<div>
<b>Wi-Fi 失敗次數：</b>
${s.wifiFailCount}
</div>

<div>
<b>MQTT 失敗次數：</b>
${s.mqttFailCount}
</div>

<div>
<b>Wi-Fi Force Reset：</b>
${s.wifiForceResetCount}
</div>

</div>

<div class="section">

<h3>
排程控制
</h3>

<div style="margin-top:12px;">

<label>

<input
type="checkbox"
id="auto_${device.id}"
${s.autoEnabled?"checked":""}
onfocus="editingSchedule=true"
/>

啟用自動排程

</label>

</div>

<div style="margin-top:16px;">

<div style="margin-bottom:12px;">

<label>
開啟時間：
</label>

<input
type="time"
id="on_${device.id}"
value="${s.onTime}"
onfocus="editingSchedule=true"
/>

</div>

<div style="margin-bottom:12px;">

<label>
關閉時間：
</label>

<input
type="time"
id="off_${device.id}"
value="${s.offTime}"
onfocus="editingSchedule=true"
/>

</div>

<div style="margin-bottom:16px;">

<label>
時區：
</label>

<select
id="tz_${device.id}"
onfocus="editingSchedule=true"
>

<option
value="8"
${s.timezone=="8"
?"selected"
:""}
>
UTC+8 台灣/香港
</option>

<option
value="9"
${s.timezone=="9"
?"selected"
:""}
>
UTC+9 日本
</option>

</select>

</div>

<button
class="btn-save"
onclick="
saveSchedule(
'${device.id}'
)
"
>

儲存排程設定

</button>

</div>

</div>

<div
class="small"
style="margin-top:15px;"
>

最後更新：
${s.lastUpdate}

</div>

</div>

<div class="btn-row">

<button
class="btn-on"
onclick="
sendCommand(
'${device.id}',
'ON'
)
"
>

手動開啟

</button>

<button
class="btn-off"
onclick="
sendCommand(
'${device.id}',
'OFF'
)
"
>

手動關閉

</button>

</div>

</div>

`;
}

// =====================================================
// First Render
// =====================================================

render();

// =====================================================
// MQTT Connect
// =====================================================

const client =
mqtt.connect(MQTT_BROKER);

client.on("connect",()=>{

  document.getElementById(
    "mqttStatus"
  ).innerHTML =

  `
  <span class="status online">
  MQTT 已連線
  </span>
  `;

  DEVICES.forEach(device=>{

    const topics =
    getTopics(device.base);

    Object.values(topics)
    .forEach(topic=>{

      client.subscribe(topic);

    });
  });
});

// =====================================================
// MQTT Message
// =====================================================

client.on("message",(topic,payload)=>{

  const msg =
  payload.toString();

  DEVICES.forEach(device=>{

    const topics =
    getTopics(device.base);

    const s =
    state[device.id];

    if(topic===topics.state){
      s.relay=msg;
    }

    if(topic===topics.status){
      s.status=
      msg==="online"
      ?"online"
      :"offline";
    }

    if(topic===topics.heartbeat){
      s.heartbeat=msg;
    }

    if(topic===topics.event){
      s.lastEvent=msg;
    }

    if(topic===topics.eventTime){
      s.lastEventTime=msg;
    }

    if(topic===topics.healthUptime){
      s.uptime=msg+" 秒";
    }

    if(topic===topics.healthHeap){
      s.freeHeap=msg+" bytes";
    }

    if(topic===topics.healthRssi){
      s.rssi=msg+" dBm";
    }

    if(topic===topics.diagWifiFailCount){
      s.wifiFailCount=msg;
    }

    if(topic===topics.diagMqttFailCount){
      s.mqttFailCount=msg;
    }

    if(topic===topics.diagWifiForceResetCount){
      s.wifiForceResetCount=msg;
    }

    if(topic===topics.autoEnabledState){
      s.autoEnabled=(msg==="true");
    }

    if(topic===topics.scheduleOnState){
      s.onTime=msg;
    }

    if(topic===topics.scheduleOffState){
      s.offTime=msg;
    }

    if(topic===topics.timezoneState){
      s.timezone=msg;
    }

    s.lastUpdate =
    new Date()
    .toLocaleString();

  });

  if(!editingSchedule){
    render();
  }

});

// =====================================================
// Relay Control
// =====================================================

function sendCommand(deviceId,cmd){

  const device =
  DEVICES.find(
    d=>d.id===deviceId
  );

  if(!device)return;

  const topics =
  getTopics(device.base);

  client.publish(
    topics.set,
    cmd
  );
}

// =====================================================
// Save Schedule
// =====================================================

function saveSchedule(deviceId){

  editingSchedule = false;

  const device =
  DEVICES.find(
    d=>d.id===deviceId
  );

  if(!device)return;

  const topics =
  getTopics(device.base);

  const autoEnabled =
  document.getElementById(
    `auto_${deviceId}`
  ).checked;

  const onTime =
  document.getElementById(
    `on_${deviceId}`
  ).value;

  const offTime =
  document.getElementById(
    `off_${deviceId}`
  ).value;

  const timezone =
  document.getElementById(
    `tz_${deviceId}`
  ).value;

  client.publish(
    topics.autoEnabledSet,
    autoEnabled
    ?"true"
    :"false"
  );

  client.publish(
    topics.scheduleOnSet,
    onTime
  );

  client.publish(
    topics.scheduleOffSet,
    offTime
  );

  client.publish(
    topics.timezoneSet,
    timezone
  );

  alert(
    "排程設定已送出"
  );
}

// =====================================================
// Service Worker
// =====================================================

if("serviceWorker" in navigator){

  navigator
  .serviceWorker
  .register(
    "./service-worker.js"
  );
}

</script>

</body>
</html>
